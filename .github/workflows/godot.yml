name: Godot automated checks and development export
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reverse-plan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import, test, export and package
        run: python3 tools/auto_build.py
      - name: Attach precise status
        if: always()
        run: |
          if [ -f logs/ci-status.json ]; then
            echo 'Automated status; not a complete playthrough:' >> "$GITHUB_STEP_SUMMARY"
            cat logs/ci-status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-diagnostics
          path: logs/
          retention-days: 3
      - name: Development archives only after successful export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReversePlan-DEVELOPMENT
          path: |
            build/ReversePlan_Linux_DEVELOPMENT.tar.gz
            build/ReversePlan_Source.zip
          if-no-files-found: error
          retention-days: 3
